name: lsk-core-debian

services:
  php:
    build:
      context: ../..
      dockerfile: docker/debian/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - lsk-core-debian-logs:/var/www/customers/system/logs
    healthcheck:
      test: ["CMD-SHELL", "php -m | grep -qx sqlsrv && php -m | grep -qx pdo_sqlsrv"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app

  nginx:
    build:
      context: ../..
      dockerfile: docker/nginx/Dockerfile.debian
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      - app

networks:
  app:

volumes:
  lsk-core-debian-logs:
